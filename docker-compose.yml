version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: autoflex-db
    environment:
      POSTGRES_DB: autoflexdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: